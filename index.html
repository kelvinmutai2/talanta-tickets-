<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talanta Live 2026 · 5 January · KICC Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BASE
============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
:root{
  --bg:#0a0a12;
  --panel:#15151f;
  --panel-2:#1c1c29;
  --line:rgba(255,255,255,.08);
  --line-2:rgba(255,255,255,.15);
  --text:#f4f4f8;
  --muted:#8e8ea6;
  --gold:#ffc94d;
  --gold-2:#ff9f43;
  --green:#3ddc97;
  --red:#ff6b6b;
  --r:18px;
}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 620px at 10% -12%, rgba(255,159,67,.16), transparent 62%),
    radial-gradient(760px 520px at 92% -6%, rgba(126,87,255,.18), transparent 62%),
    var(--bg);
}
[hidden]{display:none!important}
h1,h2,h3{font-family:'Sora','Inter',sans-serif;letter-spacing:-.02em;line-height:1.12}
button,input{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
@media (max-width:900px){ body{padding-bottom:88px} }

/* ============================================================
   BUTTONS
============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid transparent;border-radius:12px;padding:12px 18px;
  font-weight:600;font-size:14px;transition:.2s ease;white-space:nowrap;
}
.btn--primary{
  background:linear-gradient(135deg,var(--gold),var(--gold-2));
  color:#1a1206;box-shadow:0 14px 32px -14px rgba(255,159,67,.85);
}
.btn--primary:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-1px)}
.btn--primary:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn--ghost{border-color:var(--line-2);background:rgba(255,255,255,.035);color:var(--text)}
.btn--ghost:hover{background:rgba(255,255,255,.08)}
.btn--block{width:100%}

/* ============================================================
   NAV
============================================================ */
.nav{
  position:sticky;top:0;z-index:60;
  background:rgba(10,10,18,.75);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}
.nav__inner{
  max-width:1180px;margin:0 auto;padding:14px 24px;
  display:flex;align-items:center;gap:28px;
}
.brand{display:flex;align-items:center;gap:10px;font-family:'Sora',sans-serif;font-weight:800;font-size:18px}
.brand__mark{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--gold),var(--gold-2));
  color:#1a1206;font-size:17px;font-weight:800;
  box-shadow:0 8px 20px -8px rgba(255,159,67,.9);
}
.nav__links{display:flex;gap:26px;font-size:14px;color:var(--muted);font-weight:500}
.nav__links a{transition:.2s}
.nav__links a:hover{color:var(--text)}
.cart-btn{
  margin-left:auto;display:flex;align-items:center;gap:9px;
  padding:9px 14px;border-radius:999px;
  border:1px solid var(--line-2);background:rgba(255,255,255,.04);
  font-size:13.5px;font-weight:600;transition:.2s;
}
.cart-btn:hover{background:rgba(255,255,255,.09);border-color:rgba(255,201,77,.5)}
.cart-btn svg{opacity:.85}
.cart-badge{
  min-width:20px;height:20px;padding:0 6px;border-radius:999px;
  display:grid;place-items:center;font-size:11.5px;font-weight:700;
  background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#1a1206;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1);
}
.cart-badge.pop{transform:scale(1.35)}
@media (max-width:760px){ .nav__links{display:none} }

/* ============================================================
   HERO
============================================================ */
.hero{
  max-width:1180px;margin:0 auto;padding:48px 24px 20px;
  display:grid;grid-template-columns:360px 1fr;gap:52px;align-items:center;
}
.poster{
  position:relative;aspect-ratio:3/4;border-radius:26px;overflow:hidden;
  border:1px solid var(--line-2);padding:26px;
  display:flex;flex-direction:column;justify-content:space-between;
  background:
    radial-gradient(110% 80% at 18% 0%, rgba(255,201,77,.32), transparent 55%),
    radial-gradient(90% 70% at 95% 100%, rgba(126,87,255,.48), transparent 60%),
    linear-gradient(165deg,#1d1533 0%,#100d1c 55%,#0b0912 100%);
  box-shadow:0 50px 90px -50px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.09);
  transition:transform .5s cubic-bezier(.2,.8,.2,1);
}
.poster:hover{transform:translateY(-4px) rotate(-.4deg)}
.poster__glow{
  position:absolute;width:280px;height:280px;border-radius:50%;
  top:-90px;right:-90px;filter:blur(45px);opacity:.75;
  background:radial-gradient(circle,#ff9f43,transparent 66%);
  pointer-events:none;
}
.poster__grid{
  position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:
    linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:radial-gradient(circle at 50% 40%,#000 30%,transparent 78%);
}
.poster__top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}
.poster__brand{font-family:'Sora',sans-serif;font-weight:800;font-size:13px;letter-spacing:.34em;color:var(--gold)}
.poster__year{font-family:'Sora',sans-serif;font-weight:700;font-size:13px;color:rgba(255,255,255,.55)}
.poster__center{position:relative;z-index:2;text-align:center;margin-top:-10px}
.poster__day{
  display:block;font-family:'Sora',sans-serif;font-weight:800;font-size:104px;line-height:.86;
  background:linear-gradient(180deg,#fff,#ffc94d 70%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  letter-spacing:-.05em;
}
.poster__month{
  display:block;margin-top:8px;font-family:'Sora',sans-serif;font-weight:700;
  font-size:14px;letter-spacing:.52em;color:rgba(255,255,255,.72);text-indent:.52em;
}
.poster__bottom{position:relative;z-index:2}
.poster__line{height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin-bottom:14px}
.poster__bottom p{font-family:'Sora',sans-serif;font-weight:700;font-size:15px;letter-spacing:.16em}
.poster__bottom span{display:block;margin-top:5px;font-size:11.5px;color:var(--muted);letter-spacing:.14em}

/* hero info */
.pill{
  display:inline-flex;align-items:center;gap:8px;
  padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;
  border:1px solid rgba(255,201,77,.3);background:rgba(255,201,77,.08);color:var(--gold);
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(61,220,151,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}

.hero__title{
  font-size:clamp(38px,5vw,60px);font-weight:800;margin:18px 0 14px;
}
.hero__title .grad{
  background:linear-gradient(120deg,var(--gold),var(--gold-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero__sub{color:var(--muted);font-size:16px;max-width:520px;line-height:1.65}

.meta{display:flex;flex-wrap:wrap;gap:14px;margin:28px 0 26px}
.meta__item{
  display:flex;align-items:center;gap:12px;padding:12px 16px;
  border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025);
}
.meta__item svg{color:var(--gold);flex-shrink:0}
.meta__item strong{display:block;font-size:13.5px;font-weight:600}
.meta__item span{display:block;font-size:12px;color:var(--muted);margin-top:2px}

/* countdown */
.countdown{display:flex;align-items:center;gap:10px;margin-bottom:26px;flex-wrap:wrap}
.countdown__label{
  font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin-right:6px;
}
.cd{
  min-width:66px;padding:10px 8px;border-radius:14px;text-align:center;
  border:1px solid var(--line-2);
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.015));
}
.cd b{display:block;font-family:'Sora',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cd small{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.cd--accent b{color:var(--gold)}

.hero__actions{display:flex;gap:12px;flex-wrap:wrap}

/* ============================================================
   BOOKING LAYOUT
============================================================ */
.booking{
  max-width:1180px;margin:0 auto;padding:40px 24px 100px;
  display:grid;grid-template-columns:1fr 362px;gap:34px;align-items:start;
}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:20px;flex-wrap:wrap}
.section-head h2{font-size:24px;font-weight:700}
.section-head p{font-size:13px;color:var(--muted);margin-top:6px}
.sub-head{font-size:16px;font-weight:700;margin:34px 0 14px;display:flex;align-items:center;gap:10px}
.sub-head::after{content:'';flex:1;height:1px;background:var(--line)}

/* scarcity bar */
.scarcity{margin-bottom:22px}
.scarcity__bar{height:6px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
.scarcity__bar span{
  display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--gold),var(--gold-2),#ff6b6b);
  box-shadow:0 0 16px rgba(255,159,67,.6);
}
.scarcity p{font-size:12.5px;color:var(--muted);margin-top:9px}
.scarcity strong{color:var(--gold)}

/* ============================================================
   TICKET CARDS
============================================================ */
.ticket-list{display:flex;flex-direction:column;gap:14px}
.ticket{
  display:grid;grid-template-columns:1fr 186px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;position:relative;
  transition:border-color .25s,transform .25s,box-shadow .25s;
}
.ticket:hover{border-color:var(--line-2);transform:translateY(-2px)}
.ticket.is-selected{
  border-color:rgba(255,201,77,.5);
  box-shadow:0 0 0 1px rgba(255,201,77,.22),0 24px 48px -34px rgba(255,201,77,.85);
}
.ticket__body{padding:20px 22px}
.ticket__head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ticket__head h3{font-size:17px;font-weight:700}
.tag{
  font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;
  background:rgba(255,201,77,.13);color:var(--gold);border:1px solid rgba(255,201,77,.28);
}
.tag--green{background:rgba(61,220,151,.12);color:var(--green);border-color:rgba(61,220,151,.3)}
.tag--violet{background:rgba(126,87,255,.16);color:#b39cff;border-color:rgba(126,87,255,.35)}
.ticket__desc{font-size:13px;color:var(--muted);margin-top:6px}
.perks{list-style:none;margin-top:13px;display:flex;flex-direction:column;gap:7px}
.perks li{font-size:12.8px;color:#c3c3d4;display:flex;align-items:center;gap:8px}
.perks li::before{
  content:'';width:14px;height:14px;border-radius:50%;flex-shrink:0;
  background:rgba(61,220,151,.14)
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233ddc97' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>")
    center/9px no-repeat;
}

.ticket__buy{
  border-left:1px dashed var(--line-2);
  padding:18px 16px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;
  background:rgba(255,255,255,.022);position:relative;
}
.ticket__buy::before,.ticket__buy::after{
  content:'';position:absolute;left:-8px;width:16px;height:16px;border-radius:50%;
  background:var(--bg);
}
.ticket__buy::before{top:-8px}
.ticket__buy::after{bottom:-8px}
.ticket__price{font-family:'Sora',sans-serif;font-size:20px;font-weight:700;letter-spacing:-.02em}
.ticket__price .cur{font-size:11.5px;font-weight:600;color:var(--muted);margin-right:2px}
.ticket__per{font-size:11px;color:var(--muted);margin-top:-6px}

/* quantity stepper */
.qty{
  display:flex;align-items:center;gap:2px;margin-top:4px;
  border:1px solid var(--line-2);border-radius:999px;padding:3px;
  background:rgba(0,0,0,.25);
}
.qty-btn{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font-size:17px;font-weight:600;color:var(--muted);line-height:1;
  transition:.18s;
}
.qty-btn:hover{background:rgba(255,255,255,.1);color:var(--text)}
.qty-btn:active{transform:scale(.9)}
.qty-value{min-width:26px;text-align:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.is-selected .qty{border-color:rgba(255,201,77,.55);background:rgba(255,201,77,.1)}
.is-selected .qty-btn{color:var(--gold)}

/* ============================================================
   ADD-ONS
============================================================ */
.addon-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.addon{
  display:flex;align-items:center;gap:14px;padding:14px 16px;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  transition:.25s;
}
.addon:hover{border-color:var(--line-2)}
.addon.is-selected{border-color:rgba(255,201,77,.45);background:rgba(255,201,77,.045)}
.addon__icon{
  width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  font-size:19px;flex-shrink:0;
  background:rgba(255,255,255,.055);border:1px solid var(--line);
}
.addon__info{flex:1;min-width:0}
.addon__info strong{display:block;font-size:13.5px;font-weight:600}
.addon__info span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.addon .qty-btn{width:26px;height:26px;font-size:15px}

/* ============================================================
   ORDER SUMMARY
============================================================ */
.summary{position:sticky;top:88px;align-self:start}
.summary__card{
  border:1px solid var(--line-2);border-radius:22px;padding:22px;
  background:linear-gradient(180deg,rgba(30,30,45,.92),rgba(19,19,29,.92));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 44px 80px -54px #000;
}
.summary__head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.summary__head h3{font-size:16px;font-weight:700}
.summary__date{font-size:11.5px;color:var(--gold);font-weight:600;background:rgba(255,201,77,.1);padding:4px 9px;border-radius:8px}
.summary__items{display:flex;flex-direction:column;gap:10px;min-height:54px}
.empty{font-size:13px;color:var(--muted);line-height:1.6;padding:10px 0}
.s-item{display:flex;align-items:center;gap:10px;font-size:13.5px;animation:slideIn .28s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(-6px)}}
.s-item__qty{
  font-size:11px;font-weight:700;color:var(--gold);
  background:rgba(255,201,77,.12);padding:3px 7px;border-radius:6px;flex-shrink:0;
}
.s-item__name{flex:1;color:#d6d6e4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-item__price{font-weight:600;font-variant-numeric:tabular-nums}

.summary__rows{
  margin-top:18px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:11px;
}
.row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted)}
.row span:last-child{color:#d6d6e4;font-variant-numeric:tabular-nums}
.row.discount span:last-child{color:var(--green)}

.summary__total{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:16px;padding-top:16px;border-top:1px dashed var(--line-2);
  font-family:'Sora',sans-serif;font-weight:700;font-size:16px;
}
.summary__total span:last-child{font-size:23px;color:var(--gold);letter-spacing:-.02em}

.promo{display:flex;gap:8px;margin:18px 0 14px}
.promo input{
  flex:1;min-width:0;padding:11px 14px;border-radius:11px;
  border:1px solid var(--line-2);background:rgba(0,0,0,.3);color:var(--text);
  font-size:13px;outline:none;transition:.2s;
}
.promo input::placeholder{color:#66667e}
.promo input:focus{border-color:rgba(255,201,77,.55);box-shadow:0 0 0 3px rgba(255,201,77,.1)}
.promo button{
  padding:0 16px;border-radius:11px;font-size:13px;font-weight:600;
  border:1px solid var(--line-2);background:rgba(255,255,255,.06);transition:.2s;
}
.promo button:hover{background:rgba(255,255,255,.12)}

.summary__note{
  font-size:11.5px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.6;
}

/* ============================================================
   MOBILE BAR
============================================================ */
.mobile-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  display:none;align-items:center;gap:14px;padding:14px 18px;
  background:rgba(16,16,26,.92);backdrop-filter:blur(18px);
  border-top:1px solid var(--line-2);
  transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
}
.mobile-bar.is-visible{transform:translateY(0)}
.mobile-bar__label{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.mobile-bar__total{font-family:'Sora',sans-serif;font-size:19px;font-weight:700;color:var(--gold)}
.mobile-bar .btn{margin-left:auto}
@media (max-width:900px){ .mobile-bar{display:flex} }

/* ============================================================
   MODAL
============================================================ */
.modal{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;padding:20px}
.modal__backdrop{position:absolute;inset:0;background:rgba(4,4,10,.72);backdrop-filter:blur(6px)}
.modal__panel{
  position:relative;width:100%;max-width:468px;max-height:92vh;overflow-y:auto;
  padding:26px;border-radius:22px;
  background:linear-gradient(180deg,#1c1c2a,#111119);
  border:1px solid var(--line-2);
  box-shadow:0 60px 120px -40px #000;
  animation:pop .28s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.965)}}
.modal__close{
  position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;
  display:grid;place-items:center;font-size:13px;color:var(--muted);
  background:rgba(255,255,255,.06);transition:.2s;
}
.modal__close:hover{background:rgba(255,255,255,.14);color:var(--text)}
.modal__head h3{font-size:21px;font-weight:700}
.modal__head p{font-size:12.5px;color:var(--muted);margin-top:5px;margin-bottom:20px}

.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:7px;letter-spacing:.03em}
.field input{
  width:100%;padding:12px 14px;border-radius:11px;font-size:14px;
  border:1px solid var(--line-2);background:rgba(0,0,0,.32);outline:none;transition:.2s;
}
.field input::placeholder{color:#5c5c74}
.field input:focus{border-color:rgba(255,201,77,.55);box-shadow:0 0 0 3px rgba(255,201,77,.1)}
.field.has-err input{border-color:rgba(255,107,107,.7)}
.err{display:block;font-size:11.5px;color:var(--red);margin-top:5px;min-height:0}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.pay-methods{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.pay-method{
  position:relative;display:grid;place-items:center;padding:12px 6px;
  border:1px solid var(--line-2);border-radius:11px;cursor:pointer;
  font-size:12.5px;font-weight:600;color:var(--muted);transition:.2s;
}
.pay-method input{position:absolute;opacity:0;pointer-events:none}
.pay-method:hover{border-color:rgba(255,255,255,.3)}
.pay-method.is-active{
  border-color:rgba(255,201,77,.6);color:var(--gold);
  background:rgba(255,201,77,.09);
}

.modal__total{
  display:flex;justify-content:space-between;align-items:center;
  margin:20px
